# ============================================================
# network-policies-lab.yaml
# Ejercicio Resumen: Network Policies en Kubernetes
# Uso: kubectl apply -f network-policies-lab.yaml
# Duracion: ~60 minutos
#
# Este archivo despliega TODO lo necesario para practicar
# Network Policies: 3 microservicios (frontend, backend, database),
# un Pod de prueba, y las politicas de red que controlan quien
# puede hablar con quien.
#
# Orden de recursos:
#   1. Namespace lab-network-policies
#   2. Deployment + Service: frontend
#   3. Deployment + Service: backend
#   4. Deployment + Service: database
#   5. Pod test-tools (para verificar conectividad)
#   6. NetworkPolicy: deny-all (bloquear todo por defecto)
#   7. NetworkPolicy: allow-dns (permitir resolucion DNS)
#   8. NetworkPolicy: allow-frontend-to-backend
#   9. NetworkPolicy: allow-backend-to-database
# ============================================================

# =============================================================
# 1) NAMESPACE - Aislamiento del ejercicio
#    Todos los recursos del lab viven aqui para limpieza facil
# =============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-network-policies
  labels:
    env: lab
    module: network-policies

---
# =============================================================
# 2a) DEPLOYMENT: frontend
#     Simula una aplicacion web que expone el puerto 80.
#     En un escenario real seria React, Angular, etc.
#     Label tier: frontend es clave para los selectores de las
#     NetworkPolicies que controlan su acceso.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-network-policies
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
        # Genera pagina HTML identificando al microservicio
        command:
        - /bin/sh
        - -c
        - |
          cat > /usr/share/nginx/html/index.html <<'EOF'
          <h1>Frontend</h1>
          <p>Microservicio: frontend</p>
          <p>Puede hablar con: backend:8080</p>
          EOF
          exec nginx -g 'daemon off;'
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
# =============================================================
# 2b) SERVICE: frontend
#     ClusterIP interno para acceder al frontend.
#     Los NetworkPolicy selectores usaran app: frontend
#     para identificar a este grupo de Pods.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lab-network-policies
  labels:
    app: frontend
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
    tier: frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http

---
# =============================================================
# 3a) DEPLOYMENT: backend
#     Simula una API REST que escucha en el puerto 8080.
#     Solo debe ser accesible DESDE el frontend (no directamente
#     desde el exterior ni desde otros Pods sin autorizacion).
#     Label tier: backend es el selector que usan las policies.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lab-network-policies
  labels:
    app: backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      tier: backend
  template:
    metadata:
      labels:
        app: backend
        tier: backend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 8080
        command:
        - /bin/sh
        - -c
        - |
          cat > /usr/share/nginx/html/index.html <<'EOF'
          <h1>Backend API</h1>
          <p>Microservicio: backend</p>
          <p>Puede hablar con: database:5432</p>
          EOF
          # Escuchar en puerto 8080
          sed -i 's/listen\s*80/listen 8080/g' /etc/nginx/conf.d/default.conf
          exec nginx -g 'daemon off;'
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
# =============================================================
# 3b) SERVICE: backend
#     ClusterIP interno. Los Pods que necesiten hablar con
#     backend usaran el nombre DNS: backend.lab-network-policies
#     Puerto 8080 corresponde al containerPort del backend.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lab-network-policies
  labels:
    app: backend
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: backend
    tier: backend
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: http

---
# =============================================================
# 4a) DEPLOYMENT: database
#     Simula una base de datos PostgreSQL en el puerto 5432.
#     SOLO debe ser accesible DESDE el backend. Ningun otro
#     Pod debe poder conectarse directamente a la base de datos.
#     Este es el recurso mas sensible del sistema.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: lab-network-policies
  labels:
    app: database
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
      tier: database
  template:
    metadata:
      labels:
        app: database
        tier: database
    spec:
      containers:
      - name: nginx
        # Usamos nginx como simulacion (en produccion seria postgres:15)
        image: nginx:alpine
        ports:
        - name: db
          containerPort: 5432
        command:
        - /bin/sh
        - -c
        - |
          cat > /usr/share/nginx/html/index.html <<'EOF'
          <h1>Database</h1>
          <p>Microservicio: database (simulado con nginx)</p>
          <p>Puerto: 5432 (PostgreSQL)</p>
          EOF
          # Escuchar en puerto 5432 (simulado)
          sed -i 's/listen\s*80/listen 5432/g' /etc/nginx/conf.d/default.conf
          exec nginx -g 'daemon off;'
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

---
# =============================================================
# 4b) SERVICE: database
#     ClusterIP para acceder a la base de datos.
#     Solo el backend deberia poder alcanzar este Service
#     una vez aplicadas las NetworkPolicies.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: lab-network-policies
  labels:
    app: database
    tier: database
spec:
  type: ClusterIP
  selector:
    app: database
    tier: database
  ports:
  - name: db
    protocol: TCP
    port: 5432
    targetPort: db

---
# =============================================================
# 5) POD: test-tools
#    Pod auxiliar con wget y nslookup para verificar
#    conectividad desde un Pod sin labels especificos.
#    Sirve para comprobar que un Pod "no autorizado" no
#    puede alcanzar backend ni database tras aplicar las policies.
#    Label role: test es importante: las policies NO lo incluyen
#    en los from: selectores, por lo que quedara bloqueado.
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: test-tools
  namespace: lab-network-policies
  labels:
    app: test-tools
    role: test
spec:
  containers:
  - name: tools
    image: busybox:1.36
    command: ['sleep', '3600']
    resources:
      requests:
        memory: "16Mi"
        cpu: "25m"
      limits:
        memory: "32Mi"
        cpu: "50m"
  restartPolicy: Never

---
# =============================================================
# 6) NETWORKPOLICY: deny-all
#    Politica de denegacion total por defecto (default deny).
#    Bloquea TODO el trafico de ingress y egress en el namespace.
#
#    Como funciona:
#    - podSelector: {} → aplica a TODOS los Pods del namespace
#    - policyTypes: [Ingress, Egress] → controla ambas direcciones
#    - Sin reglas "from" ni "to" → no permite ninguna conexion
#
#    IMPORTANTE: Sin un CNI que soporte NetworkPolicies (como
#    Calico o Cilium), esta politica no tiene efecto. El CNI
#    por defecto de Minikube (kindnet) NO las soporta.
#    Usa: minikube start --cni=calico
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: lab-network-policies
  labels:
    policy: default-deny
spec:
  # podSelector: {} sin matchLabels = aplica a TODOS los Pods
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  # Sin reglas from/to = denegar todo (default deny)

---
# =============================================================
# 7) NETWORKPOLICY: allow-dns
#    Permite resolucion DNS a todos los Pods del namespace.
#    DNS es esencial para que los Pods se comuniquen por nombre
#    (backend.lab-network-policies.svc.cluster.local).
#
#    Sin esta politica, los Pods no podran resolver nombres DNS
#    aunque tengas otras politicas que permitan el trafico HTTP.
#    CoreDNS escucha en el namespace kube-system en el puerto UDP 53.
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: lab-network-policies
  labels:
    policy: allow-dns
spec:
  # Aplica a todos los Pods del namespace
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Permitir trafico DNS hacia cualquier destino en puerto 53 UDP/TCP
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP

---
# =============================================================
# 8) NETWORKPOLICY: allow-frontend-to-backend
#    Permite al frontend conectarse al backend en el puerto 8080.
#
#    Como funciona:
#    - podSelector selecciona los Pods DESTINO (backend, tier: backend)
#    - ingress.from selecciona los Pods ORIGEN (frontend, tier: frontend)
#    - Solo permite el puerto 8080 (donde escucha el backend)
#
#    Efecto:
#    - frontend → backend:8080  ✓ PERMITIDO
#    - test-tools → backend:8080  ✗ BLOQUEADO (no tiene label tier: frontend)
#    - database → backend:8080   ✗ BLOQUEADO (no tiene label tier: frontend)
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: lab-network-policies
  labels:
    policy: allow-frontend-to-backend
spec:
  # Esta policy se aplica a los Pods del BACKEND (destino del trafico)
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Ingress
  ingress:
  # Solo permitir trafico que viene de Pods con label tier: frontend
  - from:
    - podSelector:
        matchLabels:
          tier: frontend
    ports:
    - protocol: TCP
      port: 8080

---
# =============================================================
# 9) NETWORKPOLICY: allow-backend-to-database
#    Permite al backend conectarse a la base de datos en el puerto 5432.
#
#    Como funciona:
#    - podSelector selecciona los Pods DESTINO (database, tier: database)
#    - ingress.from selecciona los Pods ORIGEN (backend, tier: backend)
#    - Solo permite el puerto 5432 (PostgreSQL)
#
#    Efecto:
#    - backend → database:5432  ✓ PERMITIDO
#    - frontend → database:5432  ✗ BLOQUEADO (no tiene label tier: backend)
#    - test-tools → database:5432  ✗ BLOQUEADO (no tiene label tier: backend)
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
  namespace: lab-network-policies
  labels:
    policy: allow-backend-to-database
spec:
  # Esta policy se aplica a los Pods de la DATABASE (destino del trafico)
  podSelector:
    matchLabels:
      tier: database
  policyTypes:
  - Ingress
  ingress:
  # Solo permitir trafico que viene de Pods con label tier: backend
  - from:
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - protocol: TCP
      port: 5432
