# Ejercicio 2: ResourceQuotas - Limites totales por namespace
# Uso: kubectl apply -f resource-quotas.yaml
#
# Descripcion:
#   Define cuotas de recursos para cada namespace. Esto impide que
#   un equipo o capa consuma todos los recursos del cluster.
#   Sin quotas, un solo namespace podria acaparar toda la RAM y CPU
#   dejando sin recursos a los demas.
#
#   Limites definidos (ajustados para nodos Standard_D4alds_v6 de 8GB):
#   - tienda-web:   CPU 1 core, Memoria 1Gi, max 6 pods
#   - tienda-api:   CPU 3 cores, Memoria 2Gi, max 10 pods
#   - tienda-db:    CPU 1 core, Memoria 1Gi, max 4 pods
#   - stress-test:  CPU 4 cores, Memoria 3Gi, max 6 pods
#
# Conceptos clave:
#   - ResourceQuota limita el TOTAL de recursos en un namespace
#   - Si un Pod no tiene requests/limits y hay quota, sera RECHAZADO
#     (a menos que exista un LimitRange con defaults)
#   - Las quotas de pods limitan cuantos pods pueden existir
#
# Namespace: uno por cada namespace del proyecto
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-tienda-web
  namespace: tienda-web
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
    pods: "6"
    services: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-tienda-api
  namespace: tienda-api
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "1Gi"
    limits.cpu: "3"
    limits.memory: "2Gi"
    pods: "10"
    services: "6"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-tienda-db
  namespace: tienda-db
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
    pods: "4"
    services: "3"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-stress-test
  namespace: stress-test
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "1Gi"
    limits.cpu: "4"
    limits.memory: "3Gi"
    pods: "6"
