# Ejercicio 6: ConfigMap para API Gateway - Configuracion nginx como reverse proxy
# Uso: kubectl apply -f api-configmap.yaml
#
# Descripcion:
#   Configura nginx como API Gateway que:
#   - Responde /health y /ready para las probes de Kubernetes
#   - Sirve /api/info con datos del entorno (hostname, fecha)
#   - Hace proxy a Redis via un endpoint /api/redis-check
#   - Retorna headers del request en /api/echo (util para debug)
#
#   Este ConfigMap se monta como volumen en el Deployment del API Gateway.
#   Cambiar el ConfigMap y reiniciar el Pod actualiza la config sin
#   reconstruir la imagen.
#
# Conceptos clave:
#   - ConfigMap separa configuracion de la imagen del contenedor
#   - Se monta como archivo en /etc/nginx/conf.d/
#   - nginx actua como reverse proxy / API gateway
#   - Las variables $hostname y $server_addr son de nginx, no de K8s
#
# Namespace: tienda-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: tienda-api
  labels:
    app: api-gateway
    tier: backend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        # --- Health checks para Kubernetes ---
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        location /ready {
            access_log off;
            return 200 '{"status":"ready"}';
            add_header Content-Type application/json;
        }

        # --- Endpoint principal: info del pod ---
        location /api/info {
            return 200 '{"service":"api-gateway","hostname":"$hostname","server_addr":"$server_addr","remote_addr":"$remote_addr","timestamp":"$time_iso8601","message":"Respuesta desde el API Gateway en AKS"}';
            add_header Content-Type application/json;
        }

        # --- Echo: devuelve los headers del request (debug) ---
        location /api/echo {
            return 200 '{"method":"$request_method","uri":"$request_uri","host":"$host","user_agent":"$http_user_agent","x_forwarded_for":"$http_x_forwarded_for"}';
            add_header Content-Type application/json;
        }

        # --- Status del cluster (endpoint informativo) ---
        location /api/status {
            return 200 '{"cluster":"aks-laboratorio","namespace":"tienda-api","version":"1.0.0","environment":"laboratorio","node":"$hostname"}';
            add_header Content-Type application/json;
        }

        # --- Pagina raiz ---
        location / {
            return 200 '<!DOCTYPE html><html><body><h1>API Gateway - Laboratorio AKS</h1><ul><li><a href="/health">/health</a></li><li><a href="/api/info">/api/info</a></li><li><a href="/api/echo">/api/echo</a></li><li><a href="/api/status">/api/status</a></li></ul></body></html>';
            add_header Content-Type text/html;
        }
    }
