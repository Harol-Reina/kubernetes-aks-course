# Ejercicio 4: Secret para Redis - Credenciales de la base de datos
# Uso: kubectl apply -f redis-secret.yaml
#
# Descripcion:
#   Crea un Secret de tipo Opaque con la password de Redis.
#   Los Secrets almacenan datos sensibles (passwords, tokens, claves)
#   codificados en base64. Nunca pongas passwords directamente en
#   los Deployments o ConfigMaps.
#
#   Nota: En produccion usarias Azure Key Vault + CSI Driver.
#   Aqui usamos un Secret nativo de Kubernetes por simplicidad.
#
# Conceptos clave:
#   - Los Secrets se codifican en base64 (NO es encriptacion)
#   - Se montan como variables de entorno o volumenes
#   - stringData permite escribir en texto plano (K8s lo codifica)
#   - Los Secrets son namespace-scoped (solo visibles en su namespace)
#
# Namespace: tienda-db
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: tienda-db
  labels:
    app: redis
    tier: database
type: Opaque
stringData:
  redis-password: "Lab2024SecurePass!"
