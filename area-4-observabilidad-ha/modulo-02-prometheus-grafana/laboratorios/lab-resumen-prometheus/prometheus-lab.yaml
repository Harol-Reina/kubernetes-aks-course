# ============================================================
# prometheus-lab.yaml
# Ejercicio Resumen: Prometheus + Grafana - Stack de Monitoreo
# Uso: kubectl apply -f prometheus-lab.yaml
# Duracion: ~60 minutos
#
# Este archivo despliega TODO lo necesario para practicar los
# conceptos principales de monitoreo con Prometheus y Grafana:
#   - Namespace dedicado lab-prometheus
#   - Deployment "webapp-metricas" (nginx exponiendo metricas)
#   - Service para la webapp (ClusterIP)
#   - ConfigMap con configuracion de Prometheus
#   - Deployment "prometheus" (prom/prometheus)
#   - Service para Prometheus (NodePort 30090)
#   - Deployment "grafana" (grafana/grafana)
#   - Service para Grafana (NodePort 30300)
#   - Pod "generador-carga" para producir trafico y metricas
# ============================================================

# =============================================================
# 1) NAMESPACE: lab-prometheus
#    Aislamiento del ejercicio. Todos los recursos van aqui.
# =============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-prometheus
  labels:
    lab: prometheus-resumen
    area: observabilidad

---
# =============================================================
# 2) CONFIGMAP: prometheus-config
#    Configuracion de Prometheus en formato YAML.
#    Define el intervalo de scraping y los targets a monitorear.
#
#    Conceptos clave:
#      - scrape_interval: cada cuanto recolecta metricas (15s)
#      - scrape_configs: lista de jobs con sus targets
#      - job_name: nombre logico del grupo de targets
#      - static_configs: lista fija de hosts:puerto a monitorear
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab-prometheus
  labels:
    app: prometheus
    component: config
data:
  prometheus.yml: |
    # Configuracion global de Prometheus
    global:
      # Cada cuanto tiempo recolecta metricas de cada target
      scrape_interval: 15s
      # Cada cuanto tiempo evalua las reglas de alerta
      evaluation_interval: 15s

    # Lista de jobs de scraping: define QUE monitorear y DONDE
    scrape_configs:

      # Job 1: Prometheus se monitorea a si mismo
      # Prometheus expone sus propias metricas en /metrics
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Job 2: Monitorear nuestra webapp de metricas
      # El Service "webapp-metricas" resuelve a los Pods de nginx
      - job_name: 'webapp-metricas'
        static_configs:
          - targets: ['webapp-metricas:80']
        # Ruta donde nginx expone sus metricas (nginx-prometheus-exporter)
        metrics_path: '/metrics'
        # Si el endpoint no responde, no lo considera un error critico
        honor_timestamps: true

      # Job 3: Monitorear el propio Pod de Prometheus via Kubernetes SD
      # En un entorno real usarias kubernetes_sd_configs para auto-descubrir
      # todos los Pods. Aqui lo simplificamos con static_configs.
      - job_name: 'generador-carga'
        static_configs:
          - targets: ['generador-carga:8080']
        metrics_path: '/metrics'

---
# =============================================================
# 3) DEPLOYMENT: webapp-metricas
#    Nginx con nginx-prometheus-exporter como sidecar.
#    Expone metricas de nginx en formato Prometheus en /metrics.
#
#    Contenedores:
#      - nginx: servidor web que genera trafico HTTP
#      - nginx-exporter: sidecar que lee las stats de nginx
#        y las convierte a formato Prometheus en :9113/metrics
#
#    Nota didactica: El patron sidecar exporter es comun en
#    produccion cuando la app principal no expone /metrics.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-metricas
  namespace: lab-prometheus
  labels:
    app: webapp-metricas
    tier: frontend
    component: webserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-metricas
  template:
    metadata:
      labels:
        app: webapp-metricas
        tier: frontend
        component: webserver
      # Anotacion que Prometheus usa para auto-descubrir este Pod
      # (en entornos con kubernetes_sd_configs)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      # Contenedor principal: nginx
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
        # Habilitar stub_status de nginx para que el exporter pueda leerlo
        # En un entorno real estaria en un ConfigMap separado
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                cat > /etc/nginx/conf.d/status.conf << 'EOF'
                server {
                  listen 8080;
                  location /nginx_status {
                    stub_status on;
                    access_log off;
                  }
                  location / {
                    return 200 'webapp-metricas OK\n';
                    add_header Content-Type text/plain;
                  }
                }
                EOF
                nginx -s reload 2>/dev/null || true

      # Sidecar: nginx-prometheus-exporter
      # Lee stub_status de nginx y genera metricas Prometheus
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:0.11.0
        args:
        - --nginx.scrape-uri=http://localhost:8080/nginx_status
        ports:
        - name: metrics
          containerPort: 9113
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "32Mi"

---
# =============================================================
# 4) SERVICE: webapp-metricas
#    Expone la webapp internamente dentro del cluster.
#    ClusterIP: solo accesible desde dentro del namespace.
#    Puerto 80 -> nginx, Puerto 9113 -> metricas del exporter
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: webapp-metricas
  namespace: lab-prometheus
  labels:
    app: webapp-metricas
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: webapp-metricas
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: metrics
    port: 9113
    targetPort: metrics

---
# =============================================================
# 5) DEPLOYMENT: prometheus
#    Servidor Prometheus que hace scraping de metricas.
#    Monta el ConfigMap como archivo prometheus.yml.
#
#    Conceptos clave:
#      - volumeMounts: donde montar el volumen dentro del contenedor
#      - volumes: define el volumen (en este caso, un ConfigMap)
#      - args: argumentos de arranque de Prometheus
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lab-prometheus
  labels:
    app: prometheus
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
        # Ruta al archivo de configuracion montado desde el ConfigMap
        - --config.file=/etc/prometheus/prometheus.yml
        # Directorio de almacenamiento de datos de series temporales
        - --storage.tsdb.path=/prometheus
        # Cuanto tiempo conservar los datos (en produccion: 15d-90d)
        - --storage.tsdb.retention.time=1h
        # Habilitar API web (necesario para Grafana)
        - --web.enable-lifecycle
        ports:
        - name: web
          containerPort: 9090
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        # Montar el ConfigMap como archivo de configuracion
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        # Directorio para almacenamiento de datos (emptyDir para el lab)
        - name: prometheus-data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      # Volumen 1: ConfigMap con prometheus.yml
      - name: prometheus-config
        configMap:
          name: prometheus-config
      # Volumen 2: Almacenamiento temporal de datos (se pierde al reiniciar)
      # En produccion usarias un PersistentVolumeClaim
      - name: prometheus-data
        emptyDir: {}

---
# =============================================================
# 6) SERVICE: prometheus
#    NodePort para acceder a la UI de Prometheus desde fuera
#    del cluster (desde tu maquina con minikube).
#
#    Puerto 9090 (interno) -> NodePort 30090 (externo)
#    Acceso: minikube service prometheus -n lab-prometheus
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab-prometheus
  labels:
    app: prometheus
    component: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: web
    port: 9090
    targetPort: web
    nodePort: 30090

---
# =============================================================
# 7) DEPLOYMENT: grafana
#    Dashboard de visualizacion de metricas.
#    Conecta con Prometheus como datasource.
#
#    Variables de entorno:
#      GF_SECURITY_ADMIN_USER: usuario admin (default: admin)
#      GF_SECURITY_ADMIN_PASSWORD: contrasena admin
#      GF_AUTH_ANONYMOUS_ENABLED: permite acceso sin login (lab)
#      GF_DATASOURCES_DEFAULT_DATASOURCE: configura Prometheus auto.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: lab-prometheus
  labels:
    app: grafana
    component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: visualization
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.1.0
        ports:
        - name: web
          containerPort: 3000
        env:
        # Credenciales del usuario administrador
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin123"
        # Habilitar acceso anonimo para facilidad en el lab
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Viewer"
        # Configurar Prometheus como datasource por defecto automaticamente
        - name: GF_DATASOURCES_DEFAULT_DATASOURCE_URL
          value: "http://prometheus:9090"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      # Almacenamiento temporal para dashboards y configuracion de Grafana
      # En produccion usarias un PersistentVolumeClaim
      - name: grafana-data
        emptyDir: {}

---
# =============================================================
# 8) SERVICE: grafana
#    NodePort para acceder a la UI de Grafana desde fuera
#    del cluster (desde tu maquina con minikube).
#
#    Puerto 3000 (interno) -> NodePort 30300 (externo)
#    Acceso: minikube service grafana -n lab-prometheus
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: lab-prometheus
  labels:
    app: grafana
    component: visualization
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: web
    port: 3000
    targetPort: web
    nodePort: 30300

---
# =============================================================
# 9) POD: generador-carga
#    Pod que genera trafico HTTP continuo hacia la webapp.
#    Esto produce metricas visibles en Prometheus y Grafana.
#
#    Usa busybox para ejecutar un bucle infinito de curl.
#    Sin este generador, las metricas de nginx estarian en cero
#    y no habria nada interesante que visualizar.
#
#    Genera ~2 requests por segundo con patrones mixtos:
#      - 80% requests exitosos (HTTP 200)
#      - 15% requests a rutas inexistentes (HTTP 404)
#      - 5% delays simulados (sleep aleatorio)
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: generador-carga
  namespace: lab-prometheus
  labels:
    app: generador-carga
    component: load-generator
spec:
  restartPolicy: Always
  containers:
  - name: generador
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - |
      echo "Iniciando generador de carga hacia webapp-metricas..."
      CONTADOR=0
      while true; do
        CONTADOR=$((CONTADOR + 1))

        # 80% requests normales
        curl -s -o /dev/null http://webapp-metricas/ 2>/dev/null || true

        # Cada 5 requests, uno a una ruta invalida (genera 404)
        if [ $((CONTADOR % 5)) -eq 0 ]; then
          curl -s -o /dev/null http://webapp-metricas/ruta-invalida 2>/dev/null || true
        fi

        # Cada 20 requests, un delay mayor (simula carga alta)
        if [ $((CONTADOR % 20)) -eq 0 ]; then
          echo "Request $CONTADOR - aplicando delay de 2s (simulacion de carga)"
          sleep 2
        fi

        # Pausa base entre requests: 0.5 segundos
        sleep 0.5
      done
    resources:
      requests:
        cpu: "25m"
        memory: "16Mi"
      limits:
        cpu: "100m"
        memory: "32Mi"
