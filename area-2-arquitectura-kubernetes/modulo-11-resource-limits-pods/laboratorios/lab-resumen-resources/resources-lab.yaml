# ============================================================
# resources-lab.yaml
# Ejercicio Resumen: Resource Limits - Requests, Limits y QoS
# Uso: kubectl apply -f resources-lab.yaml
# Duracion: ~15 minutos
#
# Este archivo despliega TODO lo necesario para practicar los
# conceptos principales de Resource Limits en Kubernetes:
#   - Namespace dedicado lab-resources
#   - Pod Guaranteed (request == limit)
#   - Pod Burstable (request < limit)
#   - Pod BestEffort (sin resources)
#   - Deployment con resource limits y replicas
#   - Pod multi-container con sidecars
#   - Pod con init container (regla del maximo)
#   - Pod de prueba para verificacion
# ============================================================

# =============================================================
# 1) NAMESPACE: lab-resources
#    Namespace aislado para todos los recursos del lab resumen.
# =============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-resources
  labels:
    lab: resources-resumen

---
# =============================================================
# 2) POD: QoS Guaranteed (request == limit)
#    Maxima prioridad ante eviction. Uso: apps criticas.
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  namespace: lab-resources
  labels:
    app: qos-demo
    qos: guaranteed
spec:
  containers:
  - name: app
    image: nginx:1.25-alpine
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "200m"         # request == limit
        memory: "128Mi"     # request == limit

---
# =============================================================
# 3) POD: QoS Burstable (request < limit)
#    Prioridad media. Uso: APIs y apps con trafico variable.
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  namespace: lab-resources
  labels:
    app: qos-demo
    qos: burstable
spec:
  containers:
  - name: app
    image: nginx:1.25-alpine
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"         # limit > request
        memory: "256Mi"     # limit > request

---
# =============================================================
# 4) POD: QoS BestEffort (sin resources)
#    Minima prioridad, se evicted primero. Uso: batch jobs.
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  namespace: lab-resources
  labels:
    app: qos-demo
    qos: besteffort
spec:
  containers:
  - name: app
    image: nginx:1.25-alpine
    # Sin resources definidos -> BestEffort

---
# =============================================================
# 5) DEPLOYMENT: App con resource limits (3 replicas)
#    Demuestra scheduling basado en requests y monitoreo.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: lab-resources
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"

---
# =============================================================
# 6) SERVICE: Expone el Deployment webapp
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: lab-resources
spec:
  selector:
    app: webapp
  ports:
  - port: 80
    targetPort: http
    name: http
  type: ClusterIP

---
# =============================================================
# 7) POD: Multi-container con sidecars
#    Demuestra calculo de recursos totales del Pod.
#    Total Request: CPU 400m, Mem 320Mi
#    Total Limit: CPU 800m, Mem 640Mi
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: multi-container-app
  namespace: lab-resources
  labels:
    app: multi-container
spec:
  containers:
  # Contenedor principal
  - name: app
    image: nginx:1.25-alpine
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "400m"
        memory: "256Mi"

  # Sidecar: logging
  - name: logger
    image: busybox:1.36
    command: ['sh', '-c', 'tail -f /dev/null']
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  # Sidecar: metrics
  - name: metrics
    image: busybox:1.36
    command: ['sh', '-c', 'tail -f /dev/null']
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

---
# =============================================================
# 8) POD: Init container (regla del maximo)
#    Pod Request CPU = MAX(init=500m, app=200m) = 500m
#    Despues de init, solo se usan 200m del app container.
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
  namespace: lab-resources
  labels:
    app: init-demo
spec:
  initContainers:
  - name: init-setup
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Inicializando..." && sleep 5']
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  containers:
  - name: app
    image: nginx:1.25-alpine
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

---
# =============================================================
# 9) POD: test-tools para verificaciones
#    Pod con herramientas para explorar recursos del cluster.
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: test-tools
  namespace: lab-resources
  labels:
    app: test-tools
spec:
  containers:
  - name: tools
    image: busybox:1.36
    command: ['sh', '-c', 'sleep 3600']
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
