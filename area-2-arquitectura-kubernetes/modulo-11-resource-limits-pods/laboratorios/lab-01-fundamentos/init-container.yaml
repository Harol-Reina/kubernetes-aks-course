# Ejercicio 5: Init Containers y la Regla del Maximo
# Uso: kubectl apply -f init-container.yaml
#
# Descripcion:
#   Pod con un init container que solicita mas recursos (500m CPU, 512Mi)
#   que el contenedor principal (200m CPU, 128Mi). El scheduler reserva
#   el maximo entre ambos para el placement inicial. Una vez que el init
#   container termina, solo se consumen los recursos del contenedor app.
#
# Conceptos clave:
#   - Init containers se ejecutan secuencialmente antes que los app containers
#   - Pod Request = MAX(suma app containers, max de cada init container)
#   - Los recursos del init container se liberan cuando este termina
#
# Namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
  labels:
    app: init-container-demo
    lab: fundamentos
    exercise: "5"
spec:
  initContainers:
  - name: init-db
    image: busybox:1.36
    command: ['sh', '-c', 'sleep 10']
    resources:
      requests:
        cpu: "500m"       # El init container pide mas que el app container
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  containers:
  - name: app
    image: nginx:1.25
    resources:
      requests:
        cpu: "200m"       # Menor que el init container: el scheduler usa 500m
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
