# Ejercicio 1: Tier 2 Importante - Deployment API REST con QoS Burstable
# Uso: kubectl apply -f tier2-api.yaml
#
# Descripcion:
#   Deployment de API REST con requests menores a limits, generando QoS class
#   Burstable. Incluye sidecar de logging, liveness y readiness probes.
#   Representa servicios importantes que pueden usar recursos adicionales
#   durante picos de carga sin afectar la estabilidad del nodo.
#
# Conceptos clave:
#   - QoS Burstable: request < limit en CPU o memoria
#   - Sidecar pattern con recursos independientes
#   - Liveness y readiness probes para alta disponibilidad
#   - Multi-container Pod con presupuesto de recursos separado
#
# Namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: production
  labels:
    tier: important
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: important
    spec:
      containers:
      # Contenedor principal de la API
      - name: api
        image: nginx:1.25  # Reemplazar con tu API real
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"        # request < limit → QoS Burstable
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

      # Sidecar: logging
      - name: logger
        image: busybox:1.36
        command: ['sh', '-c', 'tail -f /dev/null']
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: production
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
