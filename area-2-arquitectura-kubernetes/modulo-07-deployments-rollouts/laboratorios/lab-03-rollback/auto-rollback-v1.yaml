# Ejercicio 4: progressDeadlineSeconds - Versión Saludable
# Uso: kubectl apply -f auto-rollback-v1.yaml
#
# Descripción:
#   Deployment con progressDeadlineSeconds para detectar rollouts atascados.
#   - progressDeadlineSeconds: 120 → Si el rollout no progresa en 2 minutos,
#     Kubernetes marca el Deployment como fallido (ProgressDeadlineExceeded)
#   - maxUnavailable: 0 → Los Pods viejos se mantienen durante un fallo
#
#   IMPORTANTE: Kubernetes NO hace rollback automático cuando detecta un fallo.
#   Solo marca el Deployment como fallido. El rollback debe ser MANUAL:
#     kubectl rollout undo deployment auto-rollback
#
# Namespace: lab-rollback
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-rollback
  namespace: lab-rollback
  annotations:
    kubernetes.io/change-cause: "v1.0 - Healthy version"
spec:
  replicas: 3
  progressDeadlineSeconds: 120    # Timeout: 2 minutos para completar rollout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auto-rollback
  template:
    metadata:
      labels:
        app: auto-rollback
        version: "v1.0"
    spec:
      containers:
      - name: app
        image: nginx:1.21-alpine    # Imagen válida
        ports:
        - name: http
          containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
