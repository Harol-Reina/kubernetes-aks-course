# Ejercicio 1: Historial de Revisiones - v1.3.0 (Actualización menor)
# Uso: kubectl apply -f version-history-v4.yaml
#
# Cambios respecto a v3:
#   - image: nginx:1.21-alpine → nginx:1.22-alpine
#   - env APP_VERSION: "v1.2.0" → "v1.3.0"
#   - label version: "v1.2.0" → "v1.3.0"
#
# Esta será la REVISIÓN 4 en el historial.
#
# Namespace: lab-rollback
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: version-history
  namespace: lab-rollback
  annotations:
    kubernetes.io/change-cause: "v1.3.0 - Actualización menor nginx 1.22"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: version-history
  template:
    metadata:
      labels:
        app: version-history
        version: "v1.3.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.22-alpine    # Cambiado de 1.21 a 1.22
        ports:
        - name: http
          containerPort: 80
        env:
        - name: APP_VERSION
          value: "v1.3.0"           # Cambiado de v1.2.0 a v1.3.0
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 2
