# Ejercicio 3: Estrategia Recreate - Versión Inicial
# Uso: kubectl apply -f recreate-demo-v1.yaml
#
# Descripción:
#   Deployment con estrategia Recreate (NO rolling update).
#   A diferencia de RollingUpdate, Recreate:
#     1. Elimina TODOS los Pods viejos primero
#     2. Hay un período de DOWNTIME COMPLETO (0 Pods)
#     3. Luego crea TODOS los Pods nuevos
#     4. No hay Pods de versiones diferentes corriendo simultáneamente
#
#   Casos de uso válidos:
#     - Aplicación que NO soporta múltiples versiones simultáneas
#     - Migración de base de datos con schema incompatible
#     - Desarrollo/testing donde el downtime es aceptable
#
#   NO usar si: Necesitas alta disponibilidad o estás en producción
#
# Namespace: lab-rolling-updates
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate-demo
  namespace: lab-rolling-updates
  annotations:
    kubernetes.io/change-cause: "v1.0 - Deploy con estrategia Recreate"
spec:
  replicas: 4
  strategy:
    type: Recreate         # Sin rolling update - downtime completo
  selector:
    matchLabels:
      app: recreate-demo
  template:
    metadata:
      labels:
        app: recreate-demo
        version: "v1.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.20-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
