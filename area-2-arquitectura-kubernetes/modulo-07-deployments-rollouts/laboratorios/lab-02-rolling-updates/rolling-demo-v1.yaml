# Ejercicio 1: Rolling Update Básico - Versión Inicial
# Uso: kubectl apply -f rolling-demo-v1.yaml
#
# Descripción:
#   Deployment con 5 réplicas de nginx:1.20-alpine usando estrategia RollingUpdate.
#   - maxSurge: 1       → Permite hasta 6 Pods (5 + 1) durante el update
#   - maxUnavailable: 1 → Mínimo 4 Pods disponibles (5 - 1) durante el update
#   - readinessProbe: Verifica que el Pod responda en puerto 80 antes de aceptar tráfico
#
# Namespace: lab-rolling-updates
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-demo
  namespace: lab-rolling-updates
  annotations:
    kubernetes.io/change-cause: "v1.0 - Deploy inicial con nginx 1.20"
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Máximo 1 Pod extra durante el update
      maxUnavailable: 1    # Máximo 1 Pod no disponible durante el update
  selector:
    matchLabels:
      app: rolling-demo
  template:
    metadata:
      labels:
        app: rolling-demo
        version: "v1.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.20-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 2
