# Ejercicio 2B: Actualización Rápida - Versión Inicial
# Uso: kubectl apply -f rolling-fast-v1.yaml
#
# Descripción:
#   Deployment configurado para MÁXIMA velocidad de actualización.
#   - maxSurge: 2       → Permite hasta 8 Pods (6 + 2) durante el update
#   - maxUnavailable: 2 → Puede tener hasta 2 Pods no disponibles (mínimo 4 de 6)
#
#   Comportamiento durante update:
#     1. Crea hasta 2 Pods nuevos simultáneamente
#     2. Puede terminar hasta 2 Pods viejos a la vez
#     3. El update es MUCHO más rápido
#     4. Trade-off: disponibilidad baja al 67% (4/6) durante el proceso
#
#   Ideal para: Desarrollo, staging, o producción con tolerancia a downtime parcial
#
# Namespace: lab-rolling-updates
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-fast
  namespace: lab-rolling-updates
  annotations:
    kubernetes.io/change-cause: "v1.0 - Configuración actualización rápida"
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2          # Permite hasta 2 Pods extra simultáneos
      maxUnavailable: 2    # Tolera hasta 2 Pods no disponibles
  selector:
    matchLabels:
      app: rolling-fast
  template:
    metadata:
      labels:
        app: rolling-fast
        version: "v1.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.20-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 2
