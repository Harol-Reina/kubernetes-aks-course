# Ejercicio 2: Deployment con readiness probe incorrecta
# Uso: kubectl apply -f broken-readiness.yaml
#
# Descripcion:
#   Deployment con 3 replicas de nginx cuya readinessProbe apunta a una ruta que no existe.
#   - image: nginx:1.21-alpine → Imagen valida, los Pods SI inician correctamente
#   - readinessProbe path: /nonexistent-path → Devuelve HTTP 404, la probe falla siempre
#   - Resultado: Pods en estado Running pero 0/1 Ready
#   - El Deployment nunca alcanza el estado Available porque ningun Pod pasa la probe
#
# Problema que demuestra: Readiness probe failure (Running pero NOT Ready)
# Solucion: kubectl patch deployment broken-readiness-app con path: /
#
# Namespace: lab-troubleshooting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-readiness-app
  namespace: lab-troubleshooting
  labels:
    app: readiness-app
    tier: troubleshooting
    category: readiness-failure
spec:
  replicas: 3
  selector:
    matchLabels:
      app: readiness-app
  template:
    metadata:
      labels:
        app: readiness-app
        tier: troubleshooting
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /nonexistent-path   # Esta ruta no existe → nginx devuelve 404 → probe falla
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
