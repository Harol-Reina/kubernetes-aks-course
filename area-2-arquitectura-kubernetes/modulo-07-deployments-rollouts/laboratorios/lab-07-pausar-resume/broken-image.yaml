# Ejercicio 1: Deployment con imagen inexistente
# Uso: kubectl apply -f broken-image.yaml
#
# Descripcion:
#   Deployment con 3 replicas que referencia una imagen que no existe en Docker Hub.
#   - image: nginx:nonexistent-tag-12345 → Tag inexistente, no se puede descargar
#   - Resultado: Pods en estado ImagePullBackOff / ErrImagePull
#   - Kubelet intenta descargar la imagen y falla repetidamente con backoff exponencial
#
# Problema que demuestra: ImagePullBackOff
# Solucion: kubectl set image deployment/broken-image-app app=nginx:1.21-alpine
#
# Namespace: lab-troubleshooting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-app
  namespace: lab-troubleshooting
  labels:
    app: broken-app
    tier: troubleshooting
    category: image-pull-error
spec:
  replicas: 3
  selector:
    matchLabels:
      app: broken-app
  template:
    metadata:
      labels:
        app: broken-app
        tier: troubleshooting
    spec:
      containers:
      - name: app
        image: nginx:nonexistent-tag-12345   # Tag que no existe en Docker Hub
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
