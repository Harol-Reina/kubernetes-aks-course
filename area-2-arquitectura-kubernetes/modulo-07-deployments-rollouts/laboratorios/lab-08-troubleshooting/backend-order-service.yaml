# Parte 3 - Paso 2: Backend Order Service (Deployment + Service)
# Uso: kubectl apply -f backend-order-service.yaml
#
# Descripcion:
#   Documento multi-parte con el Deployment y Service del order-service.
#   Deployment:
#     - 4 replicas con RollingUpdate maxSurge:2 maxUnavailable:1
#       (permite mayor velocidad de deploy a costo de 1 replica no disponible)
#     - Labels: app=order-service, tier=backend, version=1.0.0
#     - Resource limits configurados para workload backend
#     - readinessProbe y livenessProbe activas
#   Service:
#     - Puerto 8081 (target http del contenedor)
#     - Selector por app=order-service
#
# Namespace: ecommerce-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce-prod
  labels:
    app: order-service
    tier: backend
  annotations:
    kubernetes.io/change-cause: "Order service v1.0.0"
spec:
  replicas: 4
  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2          # Permite 2 Pods extra durante el update (deploy rapido)
      maxUnavailable: 1    # Acepta 1 Pod no disponible durante el update

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
        tier: backend
        version: "1.0.0"
    spec:
      containers:
      - name: app
        image: nginx:1.21-alpine   # Simula backend order-service
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 80

        env:
        - name: SERVICE_NAME
          value: "order-service"
        - name: VERSION
          value: "1.0.0"

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce-prod
  labels:
    app: order-service
    tier: backend
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8081
    targetPort: http
