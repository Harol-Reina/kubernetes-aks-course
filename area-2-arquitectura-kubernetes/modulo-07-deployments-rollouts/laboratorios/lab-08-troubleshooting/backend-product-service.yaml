# Parte 3 - Paso 1: Backend Product Service (Deployment + Service)
# Uso: kubectl apply -f backend-product-service.yaml
#
# Descripcion:
#   Documento multi-parte con el Deployment y Service del product-service.
#   Deployment:
#     - 3 replicas con RollingUpdate maxSurge:1 maxUnavailable:0 (zero-downtime)
#     - Labels: app=product-service, tier=backend, version=1.0.0
#     - Resource limits configurados para workload backend
#     - readinessProbe y livenessProbe activas
#   Service:
#     - Puerto 8080 (target http del contenedor)
#     - Selector por app=product-service
#
# Namespace: ecommerce-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce-prod
  labels:
    app: product-service
    tier: backend
  annotations:
    kubernetes.io/change-cause: "Product service v1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Permite 1 Pod extra durante el update
      maxUnavailable: 0    # Sin downtime: todos los Pods deben estar disponibles

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service
        tier: backend
        version: "1.0.0"
    spec:
      containers:
      - name: app
        image: nginx:1.21-alpine   # Simula backend product-service
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 80

        env:
        - name: SERVICE_NAME
          value: "product-service"
        - name: VERSION
          value: "1.0.0"

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce-prod
  labels:
    app: product-service
    tier: backend
spec:
  selector:
    app: product-service
  ports:
  - name: http
    port: 8080
    targetPort: http
