# Ejercicio 1: Blue-Green Deployment - Service de Testing para Green
# Uso: kubectl apply -f service-green-test.yaml
#
# Descripcion:
#   Service dedicado para probar la version Green en aislamiento antes del switch.
#   - selector version: green  → Solo enruta trafico a Pods Green
#   - nodePort: 30081  → Puerto de acceso externo separado del de produccion
#   - Permite QA y smoke tests sin afectar trafico de produccion
#   - Se elimina despues de confirmar que Green funciona correctamente
#
# Namespace: lab-estrategias
---
apiVersion: v1
kind: Service
metadata:
  name: app-green-test
  namespace: lab-estrategias
  labels:
    app: myapp
    role: testing
    version: green
spec:
  type: NodePort
  selector:
    app: myapp
    version: green    # Solo Pods Green
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30081
