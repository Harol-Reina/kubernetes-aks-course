# Ejercicio 1: Blue-Green Deployment - Version Blue (Produccion Actual)
# Uso: kubectl apply -f blue-deployment.yaml
#
# Descripcion:
#   Deployment de la version "Blue" (produccion actual) con 3 replicas de nginx:1.21-alpine.
#   - version: blue  → Label que usa el Service de produccion para seleccionar estos Pods
#   - COLOR/VERSION: Variables de entorno para identificar la version en respuestas
#   - El Service app-production apunta a esta version inicialmente
#
# Namespace: lab-estrategias
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: lab-estrategias
  labels:
    app: myapp
    version: blue
  annotations:
    kubernetes.io/change-cause: "v1.0-blue - Deploy inicial con nginx 1.21"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      version: blue
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - name: http
          containerPort: 80
        env:
        - name: VERSION
          value: "v1.0-blue"
        - name: COLOR
          value: "blue"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
