# Ejercicio 1: Estrategia Recreate - Versión Inicial
# Uso: kubectl apply -f recreate-v1.yaml
#
# Descripción:
#   Deployment con 3 réplicas de nginx:1.19-alpine usando estrategia Recreate.
#   La estrategia Recreate termina TODOS los Pods existentes antes de crear los nuevos.
#   Esto causa downtime pero garantiza que solo una versión esté corriendo.
#
# Namespace: lab-recreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-recreate
  namespace: lab-recreate
  annotations:
    kubernetes.io/change-cause: "v1.0 - Deploy inicial con nginx 1.19 (Recreate)"
spec:
  replicas: 3
  strategy:
    type: Recreate    # Termina todos los Pods antes de crear nuevos
  selector:
    matchLabels:
      app: nginx-recreate
  template:
    metadata:
      labels:
        app: nginx-recreate
        version: "v1.0"
    spec:
      containers:
      - name: nginx
        image: nginx:1.19-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 2
