# Escenario 2: Security Breach - NetworkPolicy Permitir Trafico DNS
# Uso: kubectl apply -f scenario-02-netpol-allow-dns.yaml
#
# Descripcion:
#   Permite trafico Egress UDP al puerto 53 desde todos los Pods del namespace
#   production hacia los Pods de CoreDNS en kube-system. Esencial para que los
#   Pods puedan resolver nombres de Service y hostnames externos.
#
# Conceptos clave:
#   - DNS usa UDP puerto 53 (y TCP en casos especiales)
#   - Sin esta regla, los Pods no pueden resolver nombres tras default-deny
#   - namespaceSelector y podSelector juntos: AND logico (ambos deben coincidir)
#
# Namespace: production
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: production
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
