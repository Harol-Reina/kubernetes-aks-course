# Escenario 1: DNS Resolution Failure - ConfigMap de CoreDNS Correcto
# Uso: kubectl apply -f scenario-01-dns-fix-configmap.yaml
#
# Descripcion:
#   Restaura el ConfigMap de CoreDNS con la configuracion basica correcta.
#   Usar cuando el ConfigMap de CoreDNS esta corrupto o modificado incorrectamente.
#   Despues de aplicar, reiniciar los pods de CoreDNS para que tomen la nueva config.
#
# Conceptos clave:
#   - CoreDNS como DNS interno del cluster
#   - ConfigMap coredns en namespace kube-system
#   - Corefile: configuracion del servidor DNS
#
# Namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
