# Ejercicio 2: Namespace Demo - Pod Multi-Container para Analisis de Namespaces
# Uso: kubectl apply -f namespace-pod.yaml
#
# Descripcion:
#   Pod con dos contenedores busybox identicos que permiten comparar que namespaces
#   comparten (network, UTS, IPC) y cuales permanecen aislados (mount, user).
#   Los contenedores ejecutan un bucle infinito para mantenerse activos durante el analisis.
#
# Conceptos clave:
#   - Network namespace compartido: ambos contenedores tienen la misma IP
#   - UTS namespace compartido: ambos tienen el mismo hostname (nombre del Pod)
#   - IPC namespace compartido: pueden usar shared memory y semaforos
#   - Mount namespace NO compartido: cada contenedor tiene su propio filesystem
#
# Namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: namespace-demo
  labels:
    app: namespace-demo
    tier: analysis
spec:
  containers:
  - name: container1
    image: busybox
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo 'Container 1 running'; sleep 30; done"]

  - name: container2
    image: busybox
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo 'Container 2 running'; sleep 30; done"]
