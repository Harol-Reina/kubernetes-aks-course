# Ejercicio 3: Migración de Frontend Web - Nginx con ConfigMap y NodePort
# Uso: kubectl apply -f web-deployment.yaml
#
# Descripcion:
#   Migra el servicio web frontend de Docker Compose a Kubernetes.
#   Usa ConfigMap para inyectar la configuracion de nginx (proxy inverso
#   hacia la API), Deployment con 2 replicas y Service tipo NodePort para
#   acceso externo desde fuera del cluster.
#
# Conceptos clave:
#   - ConfigMap con nginx.conf como archivo de configuracion (subPath)
#   - NodePort: equivalente a "ports: 8080:80" en Docker Compose
#   - Service NodePort expone el puerto 30080 en cada nodo del cluster
#   - En Minikube usar: minikube service web --url
#
# Namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: web
    tier: frontend
data:
  nginx.conf: |
    events {}
    http {
      upstream api_backend {
        server api:3000;
      }

      server {
        listen 80;

        location / {
          root /usr/share/nginx/html;
          index index.html;
        }

        location /api/ {
          proxy_pass http://api_backend/;
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    tier: frontend
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
