# Ejercicio 3: Configuracion Fluent Bit - Sidecar de logging
# Descripcion:
#   Configuracion del sidecar Fluent Bit para procesar logs JSON
#   generados por la app Flask. Lee desde el shared volume
#   /var/log/app/access.log y escribe logs procesados en stdout
#   y en /var/log/processed/ para integracion con sistemas externos.
#
# Conceptos clave:
#   - INPUT tail: lectura continua de archivo de log
#   - FILTER parser: parseo de JSON estructurado
#   - OUTPUT file + stdout: destinos multiples
#
# Uso: montado via ConfigMap en /fluent-bit/etc/fluent-bit.conf

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /var/log/app/access.log
    Tag               app.access
    Refresh_Interval  1
    Read_from_Head    true

[FILTER]
    Name   parser
    Match  app.access
    Key_Name log
    Parser json

[OUTPUT]
    Name   file
    Match  *
    Path   /var/log/processed/
    File   processed.log
    Format json_lines

[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
