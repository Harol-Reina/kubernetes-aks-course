# Ejercicio 2: Pod Ready Sin Trafico - Label selector mismatch
# Uso: kubectl apply -f webapp-no-traffic.yaml
#
# Descripcion:
#   Deployment de 3 replicas con readinessProbe correcta que pasan a Ready.
#   Sin embargo, el Service tiene un selector incompleto (le falta tier: frontend)
#   por lo que los Endpoints quedan vacios y el trafico no llega a los Pods.
#   El alumno debe diagnosticar por que no hay trafico pese a Pods Ready.
#
# Conceptos clave:
#   - Label selector mismatch entre Service y Pods
#   - Endpoints vacios pese a Pods en estado Running/Ready
#   - Diagnostico con kubectl get endpoints y --show-labels
#
# Namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-no-traffic
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      tier: frontend    # Nota: este label
  template:
    metadata:
      labels:
        app: webapp
        tier: frontend
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  selector:
    app: webapp
    # tier: frontend    # FALTA ESTE SELECTOR (bug intencional)
  ports:
  - port: 80
