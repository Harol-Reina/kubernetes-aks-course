# ============================================================
# kubeadm-lab.yaml
# Ejercicio Resumen: Setup Completo de Cluster Kubernetes con kubeadm
# Uso: kubectl apply -f kubeadm-lab.yaml (solo para recursos K8s de verificacion)
#
# NOTA IMPORTANTE:
#   Este archivo NO reemplaza el proceso de kubeadm init/join.
#   Contiene los archivos de configuracion de referencia para
#   todas las topologias cubiertas en el modulo 22, mas recursos
#   de verificacion que se despliegan DESPUES de inicializar el cluster.
#
# Duracion: ~15 minutos (revision) + tiempo de lab individual
# ============================================================

# ============================================================
# SECCION 1: CONFIGURACION KUBEADM - CLUSTER BASICO (Lab 01)
# ============================================================
# Archivo: kubeadm-config-basic.yaml
# Uso: sudo kubeadm init --config kubeadm-config-basic.yaml
#
# Topologia: Single Control Plane + Workers
# CNI: Calico (podSubnet: 192.168.0.0/16)
# ============================================================

