# ============================================================
# SECCION 4: RECURSOS DE VERIFICACION
# Estos SI se aplican con kubectl despues de tener el cluster
# ============================================================

# 1) NAMESPACE DE PRUEBA
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-kubeadm-test
  labels:
    purpose: verification
    module: "22"

---
# 2) DEPLOYMENT DE PRUEBA - Verifica scheduling y networking
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-verify
  namespace: lab-kubeadm-test
  labels:
    app: nginx-verify
    purpose: cluster-verification
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-verify
  template:
    metadata:
      labels:
        app: nginx-verify
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

---
# 3) SERVICE - Verifica networking interno del cluster
apiVersion: v1
kind: Service
metadata:
  name: nginx-verify-svc
  namespace: lab-kubeadm-test
  labels:
    app: nginx-verify
spec:
  type: ClusterIP
  selector:
    app: nginx-verify
  ports:
  - name: http
    port: 80
    targetPort: http

---
# 4) POD DE VERIFICACION DNS - Verifica CoreDNS funcional
apiVersion: v1
kind: Pod
metadata:
  name: busybox-dns-test
  namespace: lab-kubeadm-test
  labels:
    app: dns-test
    purpose: verification
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command:
    - sleep
    - "3600"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  restartPolicy: Never

---
# 5) POD DE VERIFICACION CURL - Verifica conectividad Service
apiVersion: v1
kind: Pod
metadata:
  name: curl-test
  namespace: lab-kubeadm-test
  labels:
    app: curl-test
    purpose: verification
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command:
    - sleep
    - "3600"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  restartPolicy: Never
