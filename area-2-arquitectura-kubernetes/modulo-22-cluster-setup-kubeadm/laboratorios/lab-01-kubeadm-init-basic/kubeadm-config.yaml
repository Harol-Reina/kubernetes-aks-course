# Ejercicio 1: Configuracion kubeadm init - Cluster Single Master
# Uso: cp kubeadm-config.yaml ~/kubeadm-config.yaml
#      # Editar IPs y hostname segun tu entorno
#      sudo kubeadm init --config ~/kubeadm-config.yaml --upload-certs
#
# Descripcion:
#   Archivo de configuracion para inicializar un cluster Kubernetes
#   con kubeadm. Incluye InitConfiguration (endpoint del API Server),
#   ClusterConfiguration (networking, version) y KubeletConfiguration
#   (cgroup driver). Requiere editar IPs antes de usar.
#
# Conceptos clave:
#   - InitConfiguration define el endpoint del API Server local
#   - ClusterConfiguration define networking (podSubnet, serviceSubnet)
#   - KubeletConfiguration debe coincidir con el cgroup driver de containerd
#   - podSubnet 192.168.0.0/16 es requerido para Calico CNI
#
# IMPORTANTE: Reemplazar <NODE_IP> y <NODE_HOSTNAME> con valores reales
#   Para obtener la IP del nodo: hostname -I | awk '{print $1}'
#   Para obtener el hostname: hostname

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: <NODE_IP>  # Reemplazar con la IP real del nodo
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
  imagePullPolicy: IfNotPresent
  name: <NODE_HOSTNAME>  # Reemplazar con el hostname real del nodo
  taints:
  # Taint para evitar que workloads se scheduleen en control plane
  # Remover este taint para permitir pods en single-node cluster
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
# Version de Kubernetes a instalar
kubernetesVersion: v1.28.0
# Endpoint del control plane (para HA clusters, seria un load balancer)
controlPlaneEndpoint: "<NODE_IP>:6443"  # Reemplazar con la IP real del nodo
# Configuracion de networking
networking:
  # Pod subnet - DEBE coincidir con CNI plugin
  # Calico usa 192.168.0.0/16 por defecto
  # Flannel usa 10.244.0.0/16 por defecto
  podSubnet: "192.168.0.0/16"
  # Service subnet - ClusterIP range
  serviceSubnet: "10.96.0.0/12"
  # DNS domain del cluster
  dnsDomain: "cluster.local"

# Configuracion del API Server
apiServer:
  timeoutForControlPlane: 4m0s
  extraArgs:
    # Modos de autorizacion
    authorization-mode: "Node,RBAC"
    # Habilitar admission plugins utiles
    enable-admission-plugins: "NodeRestriction"

# Configuracion del Controller Manager
controllerManager:
  extraArgs:
    # Bind address (0.0.0.0 permite metrics desde cualquier interfaz)
    bind-address: "0.0.0.0"

# Configuracion del Scheduler
scheduler:
  extraArgs:
    # Bind address (0.0.0.0 permite metrics desde cualquier interfaz)
    bind-address: "0.0.0.0"

# Configuracion de etcd
etcd:
  local:
    # Directorio de datos de etcd
    dataDir: /var/lib/etcd

---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Cgroup driver - DEBE coincidir con container runtime
# containerd usa 'systemd' por defecto en configuracion estandar
cgroupDriver: systemd
