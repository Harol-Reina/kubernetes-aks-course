# ============================================================
# services-lab.yaml
# Ejercicio Resumen: Deployment + 4 tipos de Service + Pods de prueba
# Uso: kubectl apply -f services-lab.yaml
# Duracion: ~15 minutos
#
# Este archivo despliega TODO lo necesario para comparar los 4 tipos
# de Service de Kubernetes usando un unico backend nginx.
# Incluye Pods de busybox para probar DNS, conectividad y balanceo.
# ============================================================

# =============================================================
# 1) NAMESPACE - Aislamiento del ejercicio
# =============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-services

---
# =============================================================
# 2) DEPLOYMENT - Backend con 3 replicas
#    Cada Pod genera HTML con su nombre e IP para verificar balanceo
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: lab-services
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
      tier: api
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80

        # Downward API: inyecta metadatos del Pod como variables de entorno
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Genera pagina HTML que identifica cada Pod
        command:
        - /bin/sh
        - -c
        - |
          echo "<h1>Backend API</h1>" > /usr/share/nginx/html/index.html
          echo "<p>Pod: $POD_NAME</p>" >> /usr/share/nginx/html/index.html
          echo "<p>IP: $POD_IP</p>" >> /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'

---
# =============================================================
# 3) SERVICE: ClusterIP (interno, tipo por defecto)
#
#    - Asigna una IP virtual estable DENTRO del cluster
#    - DNS: backend-clusterip.lab-services.svc.cluster.local
#    - Solo accesible desde Pods del cluster
#    - Balancea trafico entre los 3 Pods automaticamente
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-clusterip
  namespace: lab-services
  labels:
    app: backend
spec:
  type: ClusterIP          # Tipo por defecto (puede omitirse)
  selector:
    app: backend
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80               # Puerto del Service
    targetPort: http        # Named port del container

---
# =============================================================
# 4) SERVICE: LoadBalancer (acceso externo via cloud/tunnel)
#
#    - En cloud: crea un Load Balancer real (AWS ELB, Azure LB, GCP LB)
#    - En Minikube: requiere `minikube tunnel` en otra terminal
#    - Asigna EXTERNAL-IP publica
#    - Tambien crea ClusterIP + NodePort automaticamente
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-lb
  namespace: lab-services
  labels:
    app: backend
spec:
  type: LoadBalancer
  selector:
    app: backend
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http

---
# =============================================================
# 5) SERVICE: Headless (clusterIP: None)
#
#    - NO asigna IP virtual (clusterIP = None)
#    - DNS devuelve directamente las IPs de CADA Pod individual
#    - Ideal para StatefulSets (master-slave, bases de datos)
#    - El cliente decide a que Pod conectarse
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  namespace: lab-services
  labels:
    app: backend
spec:
  clusterIP: None           # Headless: sin IP virtual
  selector:
    app: backend
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http

---
# =============================================================
# 6) SERVICE: ExternalName (alias DNS a servicio externo)
#
#    - NO selecciona Pods, NO crea Endpoints, NO balancea trafico
#    - Solo crea un registro CNAME en DNS del cluster
#    - Util para: migraciones, integrar APIs externas, abstraer URLs
#    - nslookup devuelve el dominio externo, no una IP del cluster
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-external
  namespace: lab-services
spec:
  type: ExternalName
  externalName: example.com  # Dominio externo (cambia al real)

---
# =============================================================
# 7) POD DE PRUEBA: busybox-dns
#    Para probar DNS resolution de los 4 Services
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: busybox-dns
  namespace: lab-services
  labels:
    role: test
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ['sleep', '3600']
  restartPolicy: Never

---
# =============================================================
# 8) POD DE PRUEBA: busybox-curl
#    Para probar HTTP y verificar balanceo de carga
# =============================================================
apiVersion: v1
kind: Pod
metadata:
  name: busybox-curl
  namespace: lab-services
  labels:
    role: test
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ['sleep', '3600']
  restartPolicy: Never
