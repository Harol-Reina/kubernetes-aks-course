# Ejercicio 1: NodePort - Deployment de Webapp
# Uso: kubectl apply -f webapp-deployment.yaml
#
# Descripcion:
#   Deployment con 3 replicas de nginx:alpine que genera una pagina HTML
#   mostrando Pod name, Pod IP y Node name. Permite verificar a que nodo
#   llega cada request cuando se accede via NodePort o LoadBalancer.
#   Usa Downward API para obtener metadata del Pod y del nodo.
#
# Conceptos clave:
#   - spec.nodeName via Downward API para identificar el nodo
#   - Resource requests/limits como best practice
#   - Named ports para referencia en Services
#
# Namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      tier: frontend
  template:
    metadata:
      labels:
        app: webapp
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        command:
        - /bin/sh
        - -c
        - |
          cat > /usr/share/nginx/html/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head><title>WebApp Demo</title></head>
          <body>
          <h1>NodePort Demo</h1>
          <table border="1">
            <tr><td><strong>Pod:</strong></td><td>POD_NAME_VAL</td></tr>
            <tr><td><strong>Pod IP:</strong></td><td>POD_IP_VAL</td></tr>
            <tr><td><strong>Node:</strong></td><td>NODE_NAME_VAL</td></tr>
          </table>
          </body>
          </html>
          HTML
          sed -i "s/POD_NAME_VAL/$POD_NAME/g" /usr/share/nginx/html/index.html
          sed -i "s/POD_IP_VAL/$POD_IP/g" /usr/share/nginx/html/index.html
          sed -i "s/NODE_NAME_VAL/$NODE_NAME/g" /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
