# Ejercicio 4: Service tipo LoadBalancer (requiere Cloud)
# Uso: kubectl apply -f webapp-loadbalancer.yaml
#
# Descripcion:
#   Service tipo LoadBalancer que provisiona automaticamente un balanceador
#   externo en el cloud provider (AWS ELB, GCP LB, Azure LB).
#   Asigna una IP publica accesible desde Internet.
#   Requiere cluster en cloud (AWS EKS, GCP GKE, Azure AKS).
#   En minikube/kind permanecera en estado <pending>.
#
# Conceptos clave:
#   - Cloud controller manager crea el LB automaticamente
#   - Tarda 1-3 minutos en asignar IP publica
#   - Tambien crea NodePort automaticamente (acceso via nodos)
#   - externalTrafficPolicy: Local preserva IP del cliente
#   - Cada Service LoadBalancer = 1 LB en cloud (costoso, usar Ingress para multiples)
#
# Nota: Si usas minikube, ejecuta `minikube tunnel` en otra terminal
# Relacion: Selecciona Pods de webapp-deployment.yaml
# Namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-lb
  labels:
    app: webapp
spec:
  type: LoadBalancer
  selector:
    app: webapp
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: http

  # Opcional: Preservar IP origen del cliente
  externalTrafficPolicy: Local

  # Opcional: Restringir IPs permitidas (descomentar en produccion)
  # loadBalancerSourceRanges:
  #   - "0.0.0.0/0"    # Todo el mundo (cambiar en prod)
